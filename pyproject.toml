[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syspulc"
version = "0.1.0"
description = "System Pulse Core - AI infrastructure reliability diagnostics engine (telemetry RCA, risk scoring, intermittent hang triage)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tony Lee" }]
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["syspulc", "syspulc.agents", "syspulc.cli", "syspulc.ingestors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make a bare `pytest` run work from a fresh clone without installing the
# package first (CI does exactly that; `python -m pytest` masked this by
# putting the CWD on sys.path, which is why CI failed with
# "No module named 'syspulc'" while local runs passed).
pythonpath = ["."]
